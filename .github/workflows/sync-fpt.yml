name: Sync FPT Play Group

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run inline Python script to update M3U
        run: |
          python -c '
          import urllib.request

          SOURCE_URL = "https://raw.githubusercontent.com/vuminhthanh12/vuminhthanh12/refs/heads/main/vmttv"
          TARGET_FILE = "app.m3u"

          def fetch_m3u(url):
              req = urllib.request.urlopen(url)
              return req.read().decode("utf-8", errors="ignore").splitlines()

          def is_fpt_group(line):
              return "Sự Kiện FPT" in line

          def extract_valid_channels(lines):
              valid_channels = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if line.startswith("#EXTINF:") and is_fpt_group(line):
                      channel_block = [line]
                      i += 1
                      # Gom toàn bộ các dòng thuộc kênh này cho đến khi gặp #EXTINF mới hoặc hết file
                      while i < len(lines) and not lines[i].startswith("#EXTINF:"):
                          channel_block.append(lines[i])
                          i += 1
                      
                      # Kiểm tra xem khối này có chứa m3u8 và không chứa mpd không
                      block_str = "\n".join(channel_block).lower()
                      if "m3u8" in block_str and "mpd" not in block_str:
                          valid_channels.extend(channel_block)
                      continue
                  else:
                      i += 1
              return valid_channels

          def remove_fpt_group(lines):
              cleaned = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if line.startswith("#EXTINF:") and is_fpt_group(line):
                      i += 1
                      # Xóa sạch toàn bộ khối cũ của nhóm FPT
                      while i < len(lines) and not lines[i].startswith("#EXTINF:"):
                          i += 1
                      continue
                  cleaned.append(line)
                  i += 1
              return cleaned

          try:
              source_lines = fetch_m3u(SOURCE_URL)
              new_fpt_channels = extract_valid_channels(source_lines)

              try:
                  with open(TARGET_FILE, "r", encoding="utf-8", errors="ignore") as f:
                      target_lines = f.read().splitlines()
              except FileNotFoundError:
                  target_lines = ["#EXTM3U"]

              # 1. Xóa nhóm FPT cũ đi trước
              cleaned_target = remove_fpt_group(target_lines)

              # 2. Đưa toàn bộ nhóm FPT mới xuống dưới cùng của danh sách
              final_lines = cleaned_target + new_fpt_channels

              # 3. Ghi lại file
              with open(TARGET_FILE, "w", encoding="utf-8") as f:
                  f.write("\n".join(final_lines) + "\n")
                  
              print("Đã cập nhật và chuyển nhóm Sự Kiện FPT xuống cuối file thành công!")
          except Exception as e:
              print(f"Lỗi: {e}")
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Move Su Kien FPT to bottom and update" && git push)
