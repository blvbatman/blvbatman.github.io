name: Sync FPT Play Group

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run inline Python script to update M3U
        run: |
          python -c 'import urllib.request; SOURCE_URL = "https://raw.githubusercontent.com/vuminhthanh12/vuminhthanh12/refs/heads/main/vmttv"; TARGET_FILE = "app.m3u"; req = urllib.request.urlopen(SOURCE_URL); source_lines = req.read().decode("utf-8", errors="ignore").splitlines(); valid_channels = []; i = 0
          while i < len(source_lines):
              line = source_lines[i]
              if line.startswith("#EXTINF:") and "Sự Kiện FPT" in line:
                  block = [line]
                  i += 1
                  while i < len(source_lines) and not source_lines[i].startswith("#EXTINF:"):
                      block.append(source_lines[i])
                      i += 1
                  block_str = "\n".join(block).lower()
                  if "m3u8" in block_str and "mpd" not in block_str:
                      extinf = block[0]
                      if "," in extinf:
                          parts = extinf.rsplit(",", 1)
                          block[0] = parts[0] + ",FPT " + parts[1].strip()
                      valid_channels.extend(block)
                  continue
              else:
                  i += 1
          try:
              with open(TARGET_FILE, "r", encoding="utf-8", errors="ignore") as f:
                  target_lines = f.read().splitlines()
          except FileNotFoundError:
              target_lines = ["#EXTM3U"]
          cleaned = []
          j = 0
          while j < len(target_lines):
              line = target_lines[j]
              if line.startswith("#EXTINF:") and "Sự Kiện FPT" in line:
                  j += 1
                  while j < len(target_lines) and not target_lines[j].startswith("#EXTINF:"):
                      j += 1
                  continue
              cleaned.append(line)
              j += 1
          final_lines = cleaned + valid_channels
          with open(TARGET_FILE, "w", encoding="utf-8") as f:
              f.write("\n".join(final_lines) + "\n")
          print("Thành công!")'

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update FPT prefix format and move to bottom" && git push)
