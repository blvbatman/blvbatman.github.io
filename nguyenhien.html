<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Hiền</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffe6f0;
            font-family: 'Comic Neue', sans-serif;
            margin: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .overlay-body {
            background-color: #fff7fa;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .overlay-title {
            font-size: 24px;
            color: #ff6f91;
            margin-bottom: 16px;
        }

        .overlay-button {
            background-color: #ffb3c1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .overlay-button:hover {
            background-color: #ff8c9f;
        }

        .scare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: none;
            /* Oculto inicialmente */
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <!-- Overlay de cookies kawaii -->
    <div id="overlay" class="overlay">
        <div class="overlay-body">
            <p class="overlay-title">Bạn Có Thấy Bạn Trung Dự Đẹp Trai Không?</p>
            <button id="accept-button" class="overlay-button">Có</button>
            <button id="decline-button" class="overlay-button">Không</button>
        </div>
    </div>

    <div id="scare" class="scare">
        <video id="video"
            src=""
            loop preload="auto"></video>
  </div>

    <script>
        const video = document.getElementById("video");
        const overlay = document.getElementById("overlay");
        const scare = document.getElementById("scare");
        const acceptButton = document.getElementById("accept-button");
        const declineButton = document.getElementById("decline-button");

        acceptButton.addEventListener("click", function() {
            overlay.style.display = 'none'; 
            scare.style.display = 'block';   
            video.src = "./musicvv.mp4"; // Thay link video 1 vào đây
            video.play();                    
        });

        declineButton.addEventListener("click", function() {
            overlay.style.display = 'none'; 
            scare.style.display = 'block';   
            video.src = "./trollvideo.mp4"; // Thay link video 2 vào đây
            video.play();                    
        });
    </script>

</body>

</html>
