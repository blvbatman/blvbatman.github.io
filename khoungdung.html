<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Ứng Dụng APK</title>
    <link rel="icon" type="image/png" href="./logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-image: url('https://raw.githubusercontent.com/blvbatman/APPS/refs/heads/main/nen.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            padding-bottom: 140px;
        }

        body.popup-active {
            overflow: hidden;
        }

        .page-wrapper {
            transition: none;
        }
        body.popup-active .page-wrapper {
            pointer-events: none;
            user-select: none;
        }

        /* POPUP BANNER TRUNG TÂM - ĐÃ PHÓNG TO RỘNG HƠN */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        .popup-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 15px;
            max-width: 580px; /* Phóng to chiều ngang tối đa */
            width: 92%;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            animation: popupAppear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }
        
        .popup-close-x {
            position: absolute;
            top: 10px; right: 10px;
            width: 36px; height: 36px;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 10;
            transition: background 0.2s ease;
        }
        .popup-close-x:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        .popup-img-container {
            width: 100%;
            aspect-ratio: 16 / 10; /* Chỉnh tỉ lệ hiển thị rộng thoáng hơn cho banner ngang/vuông */
            border-radius: 12px;
            overflow: hidden;
            background: #f3f4f6;
        }
        .popup-img-container img {
            width: 100%; height: 100%;
            object-fit: contain; /* Giúp ảnh/GIF không bị méo hay cắt mất góc */
        }

        /* BANNER 2 BÊN TRÁI & PHẢI */
        .side-banner {
            position: fixed;
            top: 100px;
            width: 160px;
            max-height: calc(100vh - 240px);
            z-index: 900;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .side-banner-left { left: 15px; }
        .side-banner-right { right: 15px; }

        .side-banner a img {
            width: 100%;
            height: auto;
            max-height: calc(100vh - 240px);
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .side-banner a img:hover {
            transform: scale(1.03);
        }

        /* BANNER DƯỚI */
        .bottom-banner {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 728px;
            max-height: 100px;
            z-index: 950;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .bottom-banner a {
            display: flex;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .bottom-banner img {
            width: 100%;
            height: 80px;
            object-fit: contain;
            border-radius: 8px;
        }
        .bottom-close {
            position: absolute;
            top: -10px; right: 5px;
            background: #374151; color: white;
            border-radius: 50%;
            width: 22px; height: 22px;
            font-size: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            z-index: 960;
        }

        /* DÒNG CHỮ CHẠY */
        .marquee-banner {
            width: 100%;
            background: transparent;
            overflow: hidden;
            white-space: nowrap;
            display: none;
            position: relative;
            z-index: 100;
            padding-top: 12px;
        }
        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            font-family: 'Montserrat', sans-serif; 
            font-size: 16px; font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6), 0 2px 5px rgba(0, 0, 0, 0.8); 
            line-height: 32px;
            animation: marquee 25s linear infinite;
        }
        .marquee-banner:hover .marquee-text {
            animation-play-state: paused;
            cursor: pointer;
        }

        /* TIÊU ĐỀ & CONTAINER APP */
        h1 {
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            margin-top: 20px; margin-bottom: 40px; 
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            font-size: 34px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 3px;
            padding: 0 20px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 16px 16px 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            height: 250px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.65);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.22);
            border-color: rgba(255, 255, 255, 0.9);
        }
        .app-name { font-size: 18px; font-weight: bold; color: #1a252f; text-align: center; }
        .app-logo {
            width: 80px; height: 80px; border-radius: 20px;
            object-fit: cover; background-color: #3b82f6; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold; margin: 10px 0;
        }
        .btn-group { display: flex; gap: 10px; width: 100%; }
        .btn { flex: 1; padding: 10px 0; border-radius: 10px; font-weight: bold; font-size: 14px; text-align: center; cursor: pointer; border: none; text-decoration: none; }
        .btn-download { background-color: #10b981; color: white; }
        .btn-code { background-color: #3b82f6; color: white; }
        .loading, .empty { text-align: center; grid-column: 1 / -1; font-size: 16px; color: #ffffff; margin-top: 40px; }

        /* MODAL CODE */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: rgba(255, 255, 255, 0.9); padding: 25px; border-radius: 20px;
            text-align: center; max-width: 360px; width: 90%;
        }
        .modal-code { font-size: 20px; font-weight: bold; color: #059669; background: #d1fae5; padding: 12px; border-radius: 12px; margin-bottom: 20px; }

        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
        @keyframes popupAppear { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        @media (max-width: 1350px) {
            .side-banner { display: none; }
        }
    </style>
</head>
<body class="popup-active">

    <div class="popup-overlay" id="mainPopup">
        <div class="popup-box">
            <div class="popup-close-x" onclick="closeMainPopup()">✕</div>
            
            <a href="https://vin88.cool/" target="_blank">
                <div class="popup-img-container">
                    <img src="https://phaohoa4.live/media/sponsors/materials/VIN88-NHA1-400x400.gif" alt="Banner Trung Tâm">
                </div>
            </a>
        </div>
    </div>

    <div class="page-wrapper">

        <div class="side-banner side-banner-left">
            <a href="https://ok92.run/vit/home/index/in-play" target="_blank">
                <img src="https://phaohoa4.live/media/sponsors/materials/banner_gif_ok9_100x220_copy_tDqJM2V.gif" alt="Banner Trái">
            </a>
        </div>

        <div class="side-banner side-banner-right">
            <a href="https://ok92.run/vit/home/index/in-play" target="_blank">
                <img src="https://phaohoa4.live/media/sponsors/materials/banner_gif_ok9_100x220_copy_tDqJM2V.gif" alt="Banner Phải">
            </a>
        </div>

        <div class="bottom-banner" id="bottomBanner">
            <div class="bottom-close" onclick="closeBottomBanner()">✕</div>
            <a href="https://sv88.limo/" target="_blank">
                <img src="https://phaohoa4.live/media/sponsors/materials/SV88_NHA_1920x100.gif" alt="Banner Dưới">
            </a>
        </div>

        <div class="marquee-banner" id="marqueeBanner">
            <div class="marquee-text" id="marqueeText"></div>
        </div>

        <h1>Kho Ứng Dụng APK</h1>

        <div class="container" id="app-list">
            <div class="loading">Đang tải danh sách ứng dụng...</div>
        </div>

        <div class="modal-overlay" id="codeModal">
            <div class="modal-box">
                <h3 id="modalTitle">Mã Code Downloader là:</h3>
                <div class="modal-code" id="modalCodeText">---</div>
                <button class="btn" style="background:#6b7280; color:white;" onclick="closeModal()">Đóng</button>
            </div>
        </div>

    </div>

    <script>
        const REPO_OWNER = 'blvbatman';
        const REPO_NAME = 'APPS';
        const BRANCH = 'main';

        const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`;
        const container = document.getElementById('app-list');

        function closeMainPopup() {
            const popup = document.getElementById('mainPopup');
            popup.style.opacity = '0';
            setTimeout(() => {
                popup.style.display = 'none';
                document.body.classList.remove('popup-active');
            }, 300);
        }

        function closeBottomBanner() {
            document.getElementById('bottomBanner').style.display = 'none';
        }

        async function fetchNotification() {
            const banner = document.getElementById('marqueeBanner');
            const textElement = document.getElementById('marqueeText');
            const thongBaoUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/refs/heads/${BRANCH}/thongbao.txt`;

            try {
                const response = await fetch(thongBaoUrl);
                if (response.ok) {
                    const content = await response.text();
                    const trimmedContent = content ? content.trim() : '';
                    if (trimmedContent.length > 0) {
                        textElement.innerText = trimmedContent;
                        const duration = Math.max(15, Math.ceil(trimmedContent.length * 0.25));
                        textElement.style.animationDuration = `${duration}s`;
                        banner.style.display = 'block';
                    }
                }
            } catch (error) {
                banner.style.display = 'none';
            }
        }

        async function fetchApps() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Không thể lấy dữ liệu từ GitHub');
                
                const files = await response.json();
                const apkFiles = files.filter(file => file.name.endsWith('.apk'));

                container.innerHTML = '';

                if (apkFiles.length === 0) {
                    container.innerHTML = '<div class="empty">Chưa có file APK nào trong repository.</div>';
                    return;
                }

                apkFiles.forEach((file, index) => {
                    const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/refs/heads/${BRANCH}/${encodeURIComponent(file.name)}`;
                    const nameWithoutExt = file.name.replace('.apk', '');
                    
                    let appName = nameWithoutExt;
                    let appCode = null;

                    if (nameWithoutExt.includes('-')) {
                        const parts = nameWithoutExt.split('-');
                        appName = parts[0].trim();
                        appCode = parts.slice(1).join('-').trim();
                    }

                    const allowedImageExtensions = ['.png', '.jpg', '.jpeg', '.webp'];
                    const imageFile = files.find(f => {
                        const ext = f.name.substring(f.name.lastIndexOf('.')).toLowerCase();
                        const baseName = f.name.substring(0, f.name.lastIndexOf('.'));
                        return baseName === nameWithoutExt && allowedImageExtensions.includes(ext);
                    });

                    let logoHTML = '';
                    if (imageFile) {
                        const imageUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/refs/heads/${BRANCH}/${encodeURIComponent(imageFile.name)}`;
                        logoHTML = `<img class="app-logo" src="${imageUrl}" alt="${appName}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'app-logo\\'>${appName.charAt(0).toUpperCase()}</div>';">`;
                    } else {
                        const firstChar = appName.charAt(0).toUpperCase();
                        logoHTML = `<div class="app-logo">${firstChar}</div>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="app-name">${appName}</div>
                        ${logoHTML}
                        <div class="btn-group">
                            <a href="${rawUrl}" class="btn btn-download" download>Tải về</a>
                            <button class="btn btn-code" onclick="showCode(${appCode ? `'${appCode}'` : 'null'})">Code</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = `<div class="empty" style="color: red;">Lỗi: ${error.message}</div>`;
            }
        }

        function showCode(code) {
            const modal = document.getElementById('codeModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalCodeText = document.getElementById('modalCodeText');

            if (code) {
                modalTitle.style.display = 'block';
                modalTitle.innerText = 'Mã Code Downloader là:';
                modalCodeText.innerText = code;
            } else {
                modalTitle.style.display = 'none';
                modalCodeText.innerText = 'Hiện tại chưa được update code';
            }
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('codeModal').classList.remove('active');
        }

        fetchNotification();
        fetchApps();
    </script>
</body>
</html>
