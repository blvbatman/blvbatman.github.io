<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Ứng Dụng APK</title>
    <link rel="icon" type="image/png" href="./logoapp.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        }
        body {
            /* Hình nền trang web từ GitHub */
            background-image: url('https://raw.githubusercontent.com/blvbatman/APPS/refs/heads/main/nen.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        /* 1. DÒNG CHỮ THÔNG BÁO HIỆN ĐẠI & SANG TRỌNG */
        .marquee-banner {
            width: 100%;
            background: transparent; /* Không có nền */
            overflow: hidden;
            white-space: nowrap;
            display: none; /* Ẩn nếu không có nội dung */
            position: relative;
            z-index: 100;
            padding-top: 12px;
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            /* Phông chữ Montserrat đẳng cấp UI */
            font-family: 'Montserrat', sans-serif; 
            font-size: 16px;
            font-weight: 800; /* In đậm hiện đại */
            text-transform: uppercase; /* Tự động in hoa */
            letter-spacing: 2.5px; /* Giãn khoảng cách chữ tạo nét sang trọng */
            color: #ffffff; /* Dòng chữ màu trắng */
            
            /* Đổ bóng & phát sáng huyền ảo nhẹ nhàng */
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6), 0 2px 5px rgba(0, 0, 0, 0.8); 
            line-height: 32px;
            animation: marquee 35s linear infinite; /* Chạy chậm rành rọt */
        }

        /* Dừng lại khi di chuột vào */
        .marquee-banner:hover .marquee-text {
            animation-play-state: paused;
            cursor: pointer;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* 2. TIÊU ĐỀ CHÍNH */
        h1 {
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            margin-top: 20px;
            margin-bottom: 40px; 
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.8s ease-out;
            font-size: 34px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: 0 20px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Ô CARD KÍNH TRONG SÁNG RẠNG RỠ */
        .card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 16px 16px 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 250px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            animation: cardAppear 0.5s cubic-bezier(0.25, 0.8, 0.25, 1) backwards;
        }

        .card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.65);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.22);
            border-color: rgba(255, 255, 255, 0.9);
        }

        .app-name {
            font-size: 18px;
            font-weight: bold;
            color: #1a252f;
            word-break: break-word;
            text-align: center;
            line-height: 1.3;
        }

        /* Logo bo 4 góc hình vuông */
        .app-logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            object-fit: cover;
            flex-shrink: 0;
            background-color: #3b82f6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
            margin: 10px 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover .app-logo {
            transform: scale(1.08) rotate(3deg);
        }

        /* Nút bấm màu tươi sáng */
        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-download {
            background-color: #10b981;
            color: white;
            box-shadow: 0 3px 10px rgba(16, 185, 129, 0.3);
        }
        .btn-download:hover {
            background-color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.45);
        }

        .btn-code {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 3px 10px rgba(59, 130, 246, 0.3);
        }
        .btn-code:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.45);
        }

        .loading, .empty {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 16px;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            margin-top: 40px;
            animation: fadeIn 0.5s ease;
        }

        /* Modal Code Downloader */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h3 {
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
        }
        .modal-code {
            font-size: 20px;
            font-weight: bold;
            color: #059669;
            background: #d1fae5;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            word-break: break-word;
        }
        .modal-code.no-code {
            font-size: 15px;
            color: #dc2626;
            background: #fee2e2;
            font-weight: normal;
        }
        .btn-close {
            background-color: #6b7280;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.2s;
        }
        .btn-close:hover {
            background-color: #4b5563;
            transform: translateY(-1px);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Dòng chữ thông báo font Montserrat hiện đại, phát sáng nhẹ -->
    <div class="marquee-banner" id="marqueeBanner">
        <div class="marquee-text" id="marqueeText"></div>
    </div>

    <h1>Kho Ứng Dụng APK</h1>
    <div class="container" id="app-list">
        <div class="loading">Đang tải danh sách ứng dụng...</div>
    </div>

    <!-- Bảng Modal thông báo Code Downloader -->
    <div class="modal-overlay" id="codeModal">
        <div class="modal-box">
            <h3 id="modalTitle">Mã Code Downloader là:</h3>
            <div class="modal-code" id="modalCodeText">---</div>
            <button class="btn-close" onclick="closeModal()">Đóng</button>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'blvbatman';
        const REPO_NAME = 'APPS';
        const BRANCH = 'main';

        const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents`;
        const container = document.getElementById('app-list');

        // Hàm tải file thongbao.txt
        async function fetchNotification() {
            const banner = document.getElementById('marqueeBanner');
            const textElement = document.getElementById('marqueeText');
            const thongBaoUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/refs/heads/${BRANCH}/thongbao.txt`;

            try {
                const response = await fetch(thongBaoUrl);
                if (response.ok) {
                    const content = await response.text();
                    if (content && content.trim().length > 0) {
                        textElement.innerText = content.trim();
                        banner.style.display = 'block'; // Hiển thị dòng chữ
                    } else {
                        banner.style.display = 'none';
                    }
                } else {
                    banner.style.display = 'none';
                }
            } catch (error) {
                banner.style.display = 'none';
            }
        }

        async function fetchApps() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Không thể lấy dữ liệu từ GitHub');
                
                const files = await response.json();
                const apkFiles = files.filter(file => file.name.endsWith('.apk'));

                container.innerHTML = '';

                if (apkFiles.length === 0) {
                    container.innerHTML = '<div class="empty">Chưa có file APK nào trong repository.</div>';
                    return;
                }

                apkFiles.forEach((file, index) => {
                    const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/refs/heads/${BRANCH}/${encodeURIComponent(file.name)}`;
                    const nameWithoutExt = file.name.replace('.apk', '');
                    
                    let appName = nameWithoutExt;
                    let appCode = null;

                    if (nameWithoutExt.includes('-')) {
                        const parts = nameWithoutExt.split('-');
                        appName = parts[0].trim();
                        appCode = parts.slice(1).join('-').trim();
                    }

                    const allowedImageExtensions = ['.png', '.jpg', '.jpeg', '.webp'];
                    const imageFile = files.find(f => {
                        const ext = f.name.substring(f.name.lastIndexOf('.')).toLowerCase();
                        const baseName = f.name.substring(0, f.name.lastIndexOf('.'));
                        return baseName === nameWithoutExt && allowedImageExtensions.includes(ext);
                    });

                    let logoHTML = '';
                    if (imageFile) {
                        const imageUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/refs/heads/${BRANCH}/${encodeURIComponent(imageFile.name)}`;
                        logoHTML = `<img class="app-logo" src="${imageUrl}" alt="${appName}" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'app-logo\\'>${appName.charAt(0).toUpperCase()}</div>';">`;
                    } else {
                        const firstChar = appName.charAt(0).toUpperCase();
                        logoHTML = `<div class="app-logo">${firstChar}</div>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.animationDelay = `${index * 0.08}s`;

                    card.innerHTML = `
                        <div class="app-name">${appName}</div>
                        ${logoHTML}
                        <div class="btn-group">
                            <a href="${rawUrl}" class="btn btn-download" download>Tải về</a>
                            <button class="btn btn-code" onclick="showCode(${appCode ? `'${appCode}'` : 'null'})">Code</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = `<div class="empty" style="color: red;">Lỗi: ${error.message}</div>`;
            }
        }

        function showCode(code) {
            const modal = document.getElementById('codeModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalCodeText = document.getElementById('modalCodeText');

            if (code) {
                modalTitle.style.display = 'block';
                modalTitle.innerText = 'Mã Code Downloader là:';
                modalCodeText.innerText = code;
                modalCodeText.classList.remove('no-code');
            } else {
                modalTitle.style.display = 'none';
                modalCodeText.innerText = 'Hiện tại chưa được update code';
                modalCodeText.classList.add('no-code');
            }

            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('codeModal');
            modal.classList.remove('active');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('codeModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        fetchNotification();
        fetchApps();
    </script>
</body>
</html>
